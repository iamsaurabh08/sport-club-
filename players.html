<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KickOff FC - Players</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <style>
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .player-card {
            background-color: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.3s;
            position: relative;
        }

        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: var(--primary);
        }

        .player-img-container {
            height: 300px;
            background-color: #2a3441;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
        }

        .player-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            transition: transform 0.3s;
        }

        .player-card:hover .player-img {
            transform: scale(1.05);
        }

        .player-info {
            padding: 20px;
            text-align: center;
        }

        .player-number {
            color: var(--primary);
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .player-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .player-position {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .stat-preview {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .mini-stat {
            text-align: center;
        }

        .mini-stat span {
            display: block;
            font-weight: 700;
            color: var(--text-main);
        }

        .mini-stat label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

    <header class="container" style="padding-top: 40px; text-align: center;">
        <h1 class="section-title">The Squad</h1>
        <p style="color: var(--text-muted); margin-top: -30px; margin-bottom: 40px;">Meet the athletes defending our
            badge.</p>
    </header>

    <main class="container animate-fade-in" style="margin-bottom: 60px;">

        <h3 style="margin-bottom: 20px;">Forwards</h3>
        <div class="roster-grid">
            <!-- Player 1 -->
            <div class="player-card">
                <div class="player-img-container">
                    <img class="player-img"
                        src="https://images.unsplash.com/photo-1517466787929-bc90951d0974?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80"
                        alt="Sarah Johnson" style="opacity: 0.8;">
                </div>
                <div class="player-info">
                    <div class="player-number">#10</div>
                    <div class="player-name">Sarah Johnson</div>
                    <div class="player-position">Striker</div>
                    <div class="stat-preview">
                        <div class="mini-stat"><span>12</span><label>Goals</label></div>
                        <div class="mini-stat"><span>5</span><label>Assists</label></div>
                    </div>
                </div>
            </div>
            <!-- Player 2 -->
            <div class="player-card">
                <div class="player-img-container">
                    <img class="player-img"
                        src="https://images.unsplash.com/photo-1543326727-299388a10874?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80"
                        alt="Mike Davis" style="opacity: 0.8;">
                </div>
                <div class="player-info">
                    <div class="player-number">#9</div>
                    <div class="player-name">Mike "Rocket" Davis</div>
                    <div class="player-position">Forward</div>
                    <div class="stat-preview">
                        <div class="mini-stat"><span>8</span><label>Goals</label></div>
                        <div class="mini-stat"><span>2</span><label>Assists</label></div>
                    </div>
                </div>
            </div>
        </div>

        <h3 style="margin: 40px 0 20px;">Midfielders</h3>
        <div class="roster-grid">
            <!-- Player 3 -->
            <div class="player-card">
                <div class="player-img-container">
                    <img class="player-img"
                        src="https://images.unsplash.com/photo-1518611012118-696072aa579a?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80"
                        alt="Elena Rodriguez" style="opacity: 0.8;">
                </div>
                <div class="player-info">
                    <div class="player-number">#8</div>
                    <div class="player-name">Elena Rodriguez</div>
                    <div class="player-position">Central Mid</div>
                    <div class="stat-preview">
                        <div class="mini-stat"><span>24</span><label>Tackles</label></div>
                        <div class="mini-stat"><span>88%</span><label>Pass Acc</label></div>
                    </div>
                </div>
            </div>
            <!-- Player 4 -->
            <div class="player-card">
                <div class="player-img-container">
                    <img class="player-img"
                        src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80"
                        alt="Tom Baker" style="opacity: 0.8;">
                </div>
                <div class="player-info">
                    <div class="player-number">#14</div>
                    <div class="player-name">Tom Baker</div>
                    <div class="player-position">Winger</div>
                    <div class="stat-preview">
                        <div class="mini-stat"><span>7</span><label>G/A</label></div>
                        <div class="mini-stat"><span>31km/h</span><label>Top Speed</label></div>
                    </div>
                </div>
            </div>
        </div>

        <h3 style="margin: 40px 0 20px;">Defenders</h3>
        <div class="roster-grid">
            <!-- Player 5 -->
            <div class="player-card">
                <div class="player-img-container">
                    <img class="player-img"
                        src="https://images.unsplash.com/photo-1526232761682-d26e03ac148e?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80"
                        alt="Marcus Chen" style="opacity: 0.8;">
                </div>
                <div class="player-info">
                    <div class="player-number">#4</div>
                    <div class="player-name">Marcus Chen</div>
                    <div class="player-position">Center Back</div>
                    <div class="stat-preview">
                        <div class="mini-stat"><span>15</span><label>Blocks</label></div>
                        <div class="mini-stat"><span>8</span><label>Clean Sheets</label></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>

</html>
